name: Checks

# Typecheck and unit tests. No secrets needed.
on:
  pull_request:
  push:
    branches: [main, ui-changes]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
